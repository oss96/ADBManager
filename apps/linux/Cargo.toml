[package]
name = "adbm-gtk"
description = "ADB Manager for Linux (GTK 4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "adb-manager"
path = "src/main.rs"

[dependencies]
adbm-core = { path = "../../crates/adbm-core" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
flume = "0.12.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
